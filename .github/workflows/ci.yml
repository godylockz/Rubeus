name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform_target:
          - AnyCPU
          - x86
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $package = ".netfx-reference.zip"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net40/1.0.3/microsoft.netframework.referenceassemblies.net40.1.0.3.nupkg"
          Invoke-WebRequest -Uri $url -OutFile $package
          $actualHash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          $expectedHash = "54d6e20a1b61caf79395d6d71d091265e81f5a5705ac4ae52af45ca143c3c694"
          if ($actualHash -ne $expectedHash) {
            throw "Reference assembly package hash mismatch"
          }

          Expand-Archive -Path $package -DestinationPath .netfx-reference
          $frameworkRoot = (Resolve-Path ".netfx-reference\build").Path + "\"
          "TARGET_FRAMEWORK_ROOT=$frameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release executable
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found"
          }

          $outputPath = "bin\Release\${{ matrix.platform_target }}\"
          & $msbuild Rubeus\Rubeus.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:PlatformTarget=${{ matrix.platform_target }} /p:OutputPath=$outputPath /p:TargetFrameworkRootPath=$env:TARGET_FRAMEWORK_ROOT
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Smoke test command line
        shell: pwsh
        run: |
          $executable = "Rubeus\bin\Release\${{ matrix.platform_target }}\Rubeus.exe"
          $output = & $executable 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Rubeus exited with code $LASTEXITCODE"
          }
          if ($output -notmatch "Ticket requests and renewals") {
            throw "Rubeus usage output was not detected"
          }

      - name: Smoke test CLR hosting
        shell: pwsh
        run: |
          $assemblyPath = (Resolve-Path "Rubeus\bin\Release\${{ matrix.platform_target }}\Rubeus.exe").Path
          $scriptPath = Join-Path $env:RUNNER_TEMP "clr-smoke.ps1"
          @'
          param([string]$AssemblyPath)
          $assembly = [Reflection.Assembly]::LoadFile($AssemblyPath)
          if ($assembly.ImageRuntimeVersion -ne "v4.0.30319") {
            throw "Unexpected CLR image version: $($assembly.ImageRuntimeVersion)"
          }
          $program = $assembly.GetType("Rubeus.Program", $true)
          $output = $program.GetMethod("MainString").Invoke($null, [object[]]@(""))
          if ($output -notmatch "Ticket requests and renewals") {
            throw "Rubeus usage output was not detected through CLR hosting"
          }
          '@ | Set-Content -Path $scriptPath -Encoding ascii

          if ("${{ matrix.platform_target }}" -eq "x86") {
            $powershell = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          } else {
            $powershell = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          }
          & $powershell -NoProfile -NonInteractive -File $scriptPath $assemblyPath
          if ($LASTEXITCODE -ne 0) {
            throw "CLR hosting smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Package build artifact
        shell: pwsh
        run: |
          $packageName = "Rubeus-${{ matrix.platform_target }}"
          $outputPath = "Rubeus\bin\Release\${{ matrix.platform_target }}"
          $stagingPath = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $stagingPath | Out-Null
          Copy-Item "$outputPath\Rubeus.exe" $stagingPath
          Copy-Item "$outputPath\Rubeus.exe.config" $stagingPath
          Copy-Item LICENSE $stagingPath
          @(
            "Commit=$env:GITHUB_SHA"
            "Ref=$env:GITHUB_REF_NAME"
            "Platform=${{ matrix.platform_target }}"
            "TargetFramework=.NET Framework 4.0"
          ) | Set-Content -Path "$stagingPath\BUILDINFO.txt" -Encoding ascii
          Compress-Archive -Path "$stagingPath\*" -DestinationPath "$packageName.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Rubeus-${{ matrix.platform_target }}
          path: Rubeus-${{ matrix.platform_target }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Rubeus-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum Rubeus-*.zip > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Rubeus-*.zip dist/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
